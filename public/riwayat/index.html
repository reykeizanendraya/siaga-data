<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAGA DATA - Riwayat Akses</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="app-page" class="app-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <i class="ph ph-shield-check"></i>
                <span>SIAGA DATA</span>
            </div>
            <nav class="sidebar__nav">
                <a class='sidebar__link' href='/dashboard/'>
                    <i class="ph ph-house"></i> Beranda
                </a>
                <a class='sidebar__link' href='/dokumen/'>
                    <i class="ph ph-folder"></i> Dokumen Saya
                </a>
                <a class='sidebar__link' href='/secureshare/'>
                    <i class="ph ph-share-network"></i> Secure Share
                </a>
                <a class='sidebar__link' href='/notifikasi/'>
                    <i class="ph ph-bell"></i> Notifikasi
                </a>
                <a class='sidebar__link sidebar__link--active' href='/riwayat/'>
                    <i class="ph ph-clock-counter-clockwise"></i> Riwayat Akses
                </a>
                <a class='sidebar__link' href='/helpdesk/'>
                    <i class="ph ph-headset"></i> Helpdesk
                </a>
                <div class="sidebar__divider"></div>
                <a class='sidebar__link' href='/pengaturan/'>
                    <i class="ph ph-gear"></i> Pengaturan
                </a>
                <a class='sidebar__link' href='/profil/'>
                    <i class="ph ph-user"></i> Akun
                </a>
            </nav>
            <div class="sidebar__footer">
                <button class="btn btn--danger btn--full" onclick="window.location.href='../index.html'">
                    <i class="ph ph-sign-out"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="main-header">
                <div class="main-header__title">
                    <h2 id="page-title">Riwayat Akses</h2>
                </div>
                <div class="main-header__user">
                    <button class="btn-icon"><i class="ph ph-bell"></i></button>
                    <div class="avatar" id="user-avatar-initial">C</div>
                </div>
            </header>

            <div class="content-area">
                <section id="panel-riwayat" class="panel panel--active">
                    <div class="history-list" id="history-list-container">
                        <!-- Rendered via JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <script src="../app.js"></script>
</body>
</html>
